name: 'publish @waline/client'

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-client.yml
      - packages/client/**

permissions:
  contents: read

jobs:
  release-seiun:
    if: github.repository == 'zhangyxXyz/waline' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:build
      - run: pnpm exec vitest run
      - run: pnpm run client:build
      - name: Package and verify client
        shell: bash
        run: |
          mkdir -p client-dist release-assets
          cp packages/client/dist/waline.js packages/client/dist/waline.css packages/client/dist/waline-meta.css client-dist/
          cp LICENSE client-dist/
          node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("packages/client/package.json","utf8")); fs.writeFileSync("client-dist/version.json", JSON.stringify({version:process.env.VERSION,clientVersion:pkg.version,commit:process.env.GITHUB_SHA},null,2)+"\n");'
          for file in waline.js waline.css waline-meta.css LICENSE version.json; do test -s "client-dist/$file"; done
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf release-assets/waline-client.tar.gz -C client-dist .
          cd release-assets
          sha256sum waline-client.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: waline-client
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.repository == 'walinejs/waline'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci

      - name: Build API
        run: pnpm run api:build

      - name: Build Client
        run: pnpm run client:build

      - name: WorkSpace DepCheck
        run: node scripts/workspace-publish.js @waline/client

      - name: Publish
        run: pnpm publish -r --filter @waline/client --no-git-checks
