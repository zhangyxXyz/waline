name: Publish @seiun/waline

# Only pushing an explicit version tag publishes images.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: seiun-waline-release
  cancel-in-progress: false

jobs:
  docker:
    if: github.repository == 'zhangyxXyz/waline' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate version tag
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-seiun$ ]] || {
            echo 'Use a version such as v1.41.6-seiun'; exit 1;
          }
          git merge-base --is-ancestor HEAD origin/dev || {
            echo 'Release tags must point to commits on dev'; exit 1;
          }
      - uses: docker/setup-qemu-action@v4
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@v4
      - name: Build and test tagged source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile.fork
          platforms: linux/amd64
          load: true
          tags: waline-smoke:${{ github.sha }}
          cache-from: type=gha,scope=waline-fork
      - name: Smoke test packaged assets
        env:
          IMAGE: waline-smoke:${{ github.sha }}
        shell: bash
        run: |
          container=$(docker run -d -e MYSQL_DB=smoke -e JWT_TOKEN=smoke-test "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          for attempt in $(seq 1 30); do
            if docker exec "$container" node -e "Promise.all(['waline.js','waline.css','admin.js'].map(async file => {const r=await fetch('http://localhost:8360/assets/fork/'+file);if(!r.ok || !(await r.text()).length)throw Error(file);})).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zhangyxxyz/waline
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Publish versioned image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=waline-fork
          cache-to: type=gha,mode=max,scope=waline-fork
      - name: Record deployment reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo '### 1Panel image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only the latest release cache group
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_CACHE_REF: ${{ github.ref }}
        run: python3 scripts/cleanup-release-caches.py
      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Seiun Waline

          Image: \`ghcr.io/zhangyxxyz/waline:$VERSION\`

          1Panel pinned image: \`ghcr.io/zhangyxxyz/waline@$DIGEST\`

          Platforms: linux/amd64, linux/arm64.
          EOF
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Clean temporary runner data
        if: always()
        env:
          IMAGE: waline-smoke:${{ github.sha }}
        run: |
          docker image rm "$IMAGE" || true
          docker buildx prune --all --force || true
