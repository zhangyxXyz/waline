name: 'publish @waline/server'

on:
  workflow_call:
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    name: Validate Docker image
    uses: ./.github/workflows/docker-test.yml
    permissions:
      contents: read

  docker-platform:
    name: Build Docker image (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zhangyxxyz/waline
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Publish versioned image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile.fork
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/zhangyxxyz/waline:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=waline-fork-${{ matrix.arch }}
            type=gha,scope=waline-fork
          cache-to: type=gha,mode=max,scope=waline-fork-${{ matrix.arch }}

  docker:
    name: Publish multi-platform Docker image
    needs: docker-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge native platform images
        id: publish
        env:
          IMAGE: ghcr.io/zhangyxxyz/waline
          VERSION: ${{ github.ref_name }}
          SOURCE: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$SOURCE" \
            "$IMAGE:sha-$SOURCE-amd64" "$IMAGE:sha-$SOURCE-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record deployment reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo '### 1Panel image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only the latest release cache group
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_CACHE_REF: ${{ github.ref }}
        run: python3 scripts/cleanup-release-caches.py
