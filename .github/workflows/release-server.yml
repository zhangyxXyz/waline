name: 'publish @waline/server'

on:
  workflow_call:
    outputs:
      digest:
        description: Published multi-platform image digest
        value: ${{ jobs.docker.outputs.digest }}

permissions:
  contents: read
  packages: write
  actions: write

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build and test tagged source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile.fork
          platforms: linux/amd64
          load: true
          tags: waline-smoke:${{ github.sha }}
          cache-from: type=gha,scope=waline-fork
          cache-to: type=gha,mode=max,scope=waline-fork
      - name: Smoke test packaged assets
        env:
          IMAGE: waline-smoke:${{ github.sha }}
        shell: bash
        run: |
          container=$(docker run -d -e MYSQL_DB=smoke -e JWT_TOKEN=smoke-test "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          docker exec "$container" node -e "const R=require('ip2region').default; const r=new R({ipv4db:'/app/data/ip2region-v4.db'}).search('43.132.141.24'); if(r.country!=='中国'||r.province!=='香港特别行政区')process.exit(1)"
          for attempt in $(seq 1 30); do
            if docker exec "$container" node -e "Promise.all(['waline.js','waline.css','waline-meta.css','admin.js'].map(async file => {const r=await fetch('http://localhost:8360/assets/fork/'+file);if(!r.ok || !(await r.text()).length)throw Error(file);})).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 2
          done
          exit 1

  docker-platform:
    name: Build Docker image (${{ matrix.arch }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/zhangyxxyz/waline
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long
      - name: Publish versioned image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/Dockerfile.fork
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/zhangyxxyz/waline:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=waline-fork-${{ matrix.arch }}
            type=gha,scope=waline-fork
          cache-to: type=gha,mode=max,scope=waline-fork-${{ matrix.arch }}

  docker:
    name: Publish multi-platform Docker image
    needs: docker-platform
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge native platform images
        id: publish
        env:
          IMAGE: ghcr.io/zhangyxxyz/waline
          VERSION: ${{ github.ref_name }}
          SOURCE: ${{ github.sha }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$SOURCE" \
            "$IMAGE:sha-$SOURCE-amd64" "$IMAGE:sha-$SOURCE-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record deployment reference
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          VERSION: ${{ github.ref_name }}
        run: |
          echo '### 1Panel image' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/zhangyxxyz/waline@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep only the latest release cache group
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_CACHE_REF: ${{ github.ref }}
        run: python3 scripts/cleanup-release-caches.py
