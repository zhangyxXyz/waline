name: Release Seiun client only

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seiun-waline-release
  cancel-in-progress: false

jobs:
  client:
    if: github.repository == 'zhangyxXyz/waline' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[client-only]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing release and source
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-seiun$ ]]
          git merge-base --is-ancestor HEAD origin/dev
          test "$(gh release view "$VERSION" --json isDraft --jq .isDraft)" = false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:build
      - run: pnpm exec vitest run
      - run: pnpm run client:build
      - name: Package and verify client
        shell: bash
        run: |
          mkdir -p client-dist release-assets
          cp packages/client/dist/waline.js packages/client/dist/waline.css packages/client/dist/waline-meta.css client-dist/
          cp LICENSE client-dist/
          node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("packages/client/package.json","utf8")); fs.writeFileSync("client-dist/version.json", JSON.stringify({version:process.env.VERSION,clientVersion:pkg.version,commit:process.env.GITHUB_SHA},null,2)+"\n");'
          for file in waline.js waline.css waline-meta.css LICENSE version.json; do test -s "client-dist/$file"; done
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf release-assets/waline-client.tar.gz -C client-dist .
          cd release-assets
          sha256sum waline-client.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Preserve previous client package
        run: gh release download "$VERSION" --pattern waline-client.tar.gz --pattern SHA256SUMS --dir previous-client
      - uses: actions/upload-artifact@v7
        with:
          name: previous-client
          path: previous-client/
      - name: Update client assets only
        shell: bash
        run: |
          gh release view "$VERSION" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<EOF

          ### Client-only update ($GITHUB_SHA)
          The client archive now comes from this commit. Edit/reply drafts are isolated by operation and comment, retained in page memory across switches, and removed after successful submission or page/account changes.
          The Docker image and server deployment remain unchanged; the image reference above belongs to the previous server build.
          Verify the updated client archive using SHA256SUMS and version.json.
          EOF
          gh release upload "$VERSION" release-assets/waline-client.tar.gz release-assets/SHA256SUMS --clobber
          gh release edit "$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
