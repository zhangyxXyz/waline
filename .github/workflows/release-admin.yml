name: 'publish @waline/admin'

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-admin.yml
      - packages/admin/**

permissions:
  contents: read
  id-token: write

jobs:
  release-seiun:
    if: github.repository == 'zhangyxXyz/waline' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:build
      - run: pnpm exec vitest run
      - run: pnpm run admin:build
      - name: Package admin and provenance
        shell: bash
        run: |
          mkdir -p admin-dist release-assets
          cp packages/admin/dist/admin.js admin-dist/
          cp LICENSE admin-dist/
          node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("packages/admin/package.json","utf8")); fs.writeFileSync("admin-dist/version.json", JSON.stringify({version:process.env.VERSION,adminVersion:pkg.version,commit:process.env.GITHUB_SHA},null,2)+"\n");'
          for file in admin.js LICENSE version.json; do test -s "admin-dist/$file"; done
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -czf release-assets/waline-admin.tar.gz -C admin-dist .
          cd release-assets
          sha256sum waline-admin.tar.gz > ADMIN-SHA256SUMS
          sha256sum --check ADMIN-SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: waline-admin
          path: release-assets/
          if-no-files-found: error

  publish:
    if: github.repository == 'walinejs/waline'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci

      - name: Build Admin
        run: pnpm run admin:build

      - name: Publish
        run: pnpm publish -r --filter @waline/admin --no-git-checks
